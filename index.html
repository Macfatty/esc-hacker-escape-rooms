<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Escape Rooms</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <img class="header__logo" src="images/esc-logo.svg" alt="Hacker Escape Rooms">
        <span class="header__company-text">Hacker Escape Rooms</span>
    </header>

    <main>
        <section class="hero">
            <img class="hero__image" src="images/main_img.svg" alt="Picture of a hacker in a room with many screens running hannah montana linux">
            <a href="example.com" class="hero__link hero__link--onsite">On-site Challenges</a>
            <a href="example.com" class="hero__link hero__link--online">Online Challenges</a>
        </section>
        <section class="testimonials">
            <img class="testimonials__avatar" src="images/profilbild.svg" alt="Profile Picture of John Doe">
            <div class="testimonials__content">
                <blockquote class="testimonials__quote">
                This is a quote about how amazing this place is and how much fun me and my friends had when we tried it
            </blockquote>
            <p class="testimonials__author">John Doe, visited us in September 2021</p>
            </div>
        </section>
        <section class="challenges">
            <h2 class="challenges__title">
                Popular challenges right now 
            </h2>
            <article class="challenges__card">
                <img class="challenges__card-image" src="images/challenger_card.svg" alt="Picture of man sitting in front lots of screens">
                <h3 class="challenges__card-title">
                    Title of room (on-site)
                </h3>

            </article>
        </section>

    
    </main>

 


</body>
</html>
